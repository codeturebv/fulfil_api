plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  Exclude:
    - bin/*
    - lib/generators/**/templates/**/*
    - tmp/**/*
    - vendor/**/*
  NewCops: enable
  TargetRubyVersion: 3.2

Layout/LineLength:
  Exclude:
    - fulfil_api.gemspec

Metrics/ClassLength:
  Exclude:
    - test/**/*_test.rb

Metrics/MethodLength:
  Exclude:
    - test/**/*_test.rb

Minitest/MultipleAssertions:
  Max: 5

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/ArgumentsForwarding:
  # The test helper is a documented, public API. Anonymous forwarding would hide
  #   the keyword arguments it accepts from both the reader and its YARD docs.
  Exclude:
    - lib/fulfil_api/test_helper.rb
